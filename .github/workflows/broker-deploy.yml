name: Deploy Oura Broker

# Deploys Backend/ (Cloudflare Worker) and sets its Oura secrets from
# GitHub Actions secrets. The client secret goes GitHub -> Cloudflare only;
# it is never written to disk, logged, or built into the iPhone app.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - Cloudflare token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#   OURA_CLIENT_ID         - Oura developer application client ID
#   OURA_CLIENT_SECRET     - Oura developer application client secret
# Optional repository variable:
#   OURA_BROKER_URL        - deployed broker origin, used for the smoke test

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - '.github/workflows/broker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OURA_BROKER_URL: ${{ vars.OURA_BROKER_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$OURA_CLIENT_ID" ]        || missing="$missing OURA_CLIENT_ID"
          [ -n "$OURA_CLIENT_SECRET" ]    || missing="$missing OURA_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Broker deploy skipped. Missing secrets:$missing"
            echo "Broker deploy skipped. Missing repository secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Test
        if: steps.check.outputs.ready == 'true'
        run: npm test

      - name: Deploy Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy

      # Piped through stdin so the secret never touches disk or the command line.
      # Until this step finishes, the broker fails closed (503), never open.
      - name: Set Oura secrets
        if: steps.check.outputs.ready == 'true'
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
        run: |
          jq -n --arg id "$OURA_CLIENT_ID" --arg secret "$OURA_CLIENT_SECRET" \
            '{OURA_CLIENT_ID: $id, OURA_CLIENT_SECRET: $secret}' \
            | npx wrangler secret bulk

      - name: Smoke test
        if: steps.check.outputs.ready == 'true' && env.OURA_BROKER_URL != ''
        run: |
          base="${OURA_BROKER_URL%/}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$base/health" | grep -q '"ok"'; then break; fi
            [ "$i" = 6 ] && { echo "::error::$base/health did not return ok"; exit 1; }
            sleep 10
          done
          curl -fsS "$base/config" \
            | jq -e '(.client_id | length > 0) and .redirect_uri == "com.jonisuominen.readout://oauth/oura"' >/dev/null \
            || { echo "::error::$base/config is missing the client ID or callback"; exit 1; }
          echo "Broker deployed and healthy at $base" >> "$GITHUB_STEP_SUMMARY"
